<li class="cover-card cover-card--{{ card.kind }}{% if card.group_key.is_some() %} cover-card--in-album{% endif %}"{% if let Some(key) = card.group_key %} data-album-tracks="{{ key }}" hidden{% endif %}>
  {% if card.has_cover %}
  <img class="cover-card__img" src="{{ card.cover_url }}"
       alt="" loading="lazy" decoding="async">
  {% else %}
  <img class="cover-card__img cover-card__img--placeholder" src="/poster-placeholder.svg" alt="" loading="lazy" decoding="async">
  {% endif %}
  <span class="cover-card__scrim" aria-hidden="true"></span>

  <div class="cover-card__top">
    <span class="cover-card__badge">{{ card.kind_label }}</span>
    <form method="post" action="/history/{{ card.play_id }}">
      {{ page.csrf_tag()|safe }}
      <input type="hidden" name="_method" value="delete">
      <button class="cover-card__remove" type="submit" aria-label="Remove this play of {{ card.title }}">{{ crate::web::helpers::TRASH_SVG|safe }}</button>
    </form>
  </div>

  <div class="cover-card__body">
    <span class="cover-card__titlewrap"><a class="cover-card__title" href="/items/{{ card.item_id }}">{{ card.title }}</a></span>
    {% if !card.detail_html.is_empty() %}
      <span class="cover-card__detail">{{ card.detail_html|safe }}</span>
    {% endif %}
    <span class="cover-card__meta">{{ card.meta_html|safe }}</span>
    {{ card.rating_html|safe }}
  </div>
</li>
