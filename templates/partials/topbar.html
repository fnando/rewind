<header class="topbar">
  <a class="brand" href="/">
    <span class="brand__mark"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6 L3 12 L11 18 Z M21 6 L13 12 L21 18 Z" fill="currentColor"/></svg></span>
    <span>rewind</span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="/history"{% if page.current("/history") || page.path == "/" %} aria-current="page"{% endif %}>History</a>
    <a href="/stats"{% if page.current("/stats") %} aria-current="page"{% endif %}>Stats</a>
    <a class="nav__search" href="/search"{% if page.current("/search") %} aria-current="page"{% endif %}>Search</a>
    <a href="/settings"{% if page.current("/settings") %} aria-current="page"{% endif %}>Settings</a>
  </nav>
  <form class="topsearch" method="get" action="/search" role="search">
    <span class="topsearch__icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <input class="topsearch__input" type="search" name="q" value="{{ page.search }}" placeholder="Search movies and series…" aria-label="Search movies and series">
  </form>
  {% if let Some(user) = page.user %}
  <span class="avatar-wrap">
    <a class="avatar" href="/settings" aria-label="Settings (signed in as {{ user.username }}){% if page.sync_errors %} — sync error{% endif %}">
      {% if let Some(url) = page.avatar_url %}<img src="{{ url }}" alt="">{% else %}{{ page.avatar_letter() }}{% endif %}
    </a>
    {% if page.sync_errors %}<span class="avatar-wrap__dot" aria-hidden="true"></span>{% endif %}
  </span>
  {% endif %}
</header>
